<!DOCTYPE html>
<html>
<head>
    <title>Login / Signup - AI Career Guide</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"></noscript>
</head>

<body>

    <header class="top-bar">
    <h1>AI Career Guide System</h1>
</header>

<section class="auth-container">

    <div class="auth-left">
        <h1>Start Your AI Career Journey</h1>
        <p>Sign in to unlock intelligent career insights tailored for you.</p>
    </div>

    <div class="auth-right">
        <div class="auth-box">
            <h2>Login / Sign Up</h2>

    <form onsubmit="return signupUser(event)">

    <input id="name" type="text" placeholder="Full Name" required>

    <input id="email" type="email" placeholder="Email Address" required>

    <input id="password" type="password" placeholder="Password" required>

    <button type="submit" class="btn">Continue</button>

    </form>

            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>

</section>

<script>

function signupUser(event) {

    event.preventDefault();

    let name =
        document.getElementById("name").value;

    let email =
        document.getElementById("email").value;

    let password =
        document.getElementById("password").value;

    localStorage.setItem("name", name);
    localStorage.setItem("email", email);

    window.location.href = "skills.html";

    return false;
}

</script>

</body>
</html>
