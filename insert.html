<!DOCTYPE html>
<html>
<head>

<title>More Details</title>

<link rel="stylesheet" href="style.css">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"></noscript>

</head>

<body>

<section class="skill-container">

<div class="skill-box">

<h2>More Information</h2>

<p>Enter your interest and CGPA</p>

<form onsubmit="return saveInterest()">

<input type="text"
id="interest"
placeholder="Example: AI, Cloud, Design"
required>

<input type="number"
id="cgpa"
placeholder="Enter CGPA"
step="0.1"
required>

<button type="submit" class="btn">
Continue
</button>

</form>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
