<!DOCTYPE html>
<html>
<head>

<title>Career Result</title>

<link rel="stylesheet" href="style.css">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"></noscript>

</head>

<body>
    <header class="top-bar">
    <h1>AI Career Guide System</h1>
</header>

<section class="result-container">

<div class="result-box">

<h1>Career Recommendation</h1>

<h2 id="career"></h2>

<p id="reason"></p>

<br>

<button onclick="goBack()" class="btn">
Try Again
</button>

</div>

</section>


<script>

let career = localStorage.getItem("careerResult");
let skills = localStorage.getItem("skills");
let interest = localStorage.getItem("interest");
let cgpa = localStorage.getItem("cgpa");
let field = localStorage.getItem("field");

document.getElementById("career").textContent =
"Recommended Career: " + career;

document.getElementById("reason").innerHTML =
"Based on your details:<br><br>" +
"Skills: " + skills + "<br>" +
"Interest: " + interest + "<br>" +
"CGPA: " + cgpa + "<br>" +
"Preferred Field: " + field + "<br><br>" +
"The system recommends <b>" + career +
"</b> as the most suitable career option.";

function goBack() {
    window.location.href = "skills.html";
}

</script>

</body>
</html>
